name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
permissions: {}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify and run gitleaks
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl --fail --silent --show-error --location "$base/gitleaks_8.30.1_linux_x64.tar.gz" -o "$work/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location "$base/gitleaks_8.30.1_checksums.txt" -o "$work/checksums.txt"
          (cd "$work" && grep -E '^[a-f0-9]{64}  gitleaks_8\.30\.1_linux_x64\.tar\.gz$' checksums.txt | sha256sum --check --strict -)
          tar -xzf "$work/gitleaks_8.30.1_linux_x64.tar.gz" -C "$work" gitleaks
          "$work/gitleaks" git --log-opts=--all --redact --exit-code 1 .
  build-test:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./build.sh --release --selftest --test
  sanitizers:
    name: sanitizers (${{ matrix.sanitizer }})
    # Private repo: macOS minutes count 10x, so heavy jobs run on main only.
    # Once the repository is public they also run on every pull request.
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && !github.event.repository.private)
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, tsan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Swift Testing under sanitizer
        env:
          SANITIZER: ${{ matrix.sanitizer }}
        run: ./build.sh "--$SANITIZER"
  leaks:
    # Private repo: macOS minutes count 10x, so heavy jobs run on main only.
    # Once the repository is public they also run on every pull request.
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && !github.event.repository.private)
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./build.sh --leaks
  lint:
    # Private repo: macOS minutes count 10x, so heavy jobs run on main only.
    # Once the repository is public they also run on every pull request.
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && !github.event.repository.private)
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install linters
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install swiftlint swift-format
      - run: swiftlint lint --strict
      - run: swift-format lint --strict --recursive Package.swift Sources Tests
